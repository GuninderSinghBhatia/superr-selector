[project]
name = "superr-selector"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "GuninderSinghBhatia", email = "guninder.growth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "python-docx>=1.2.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
]

[project.scripts]
superr-selector = "superr_selector:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
